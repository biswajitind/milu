apiVersion: v1
kind: ConfigMap
metadata:
  name: milu
data:
  OPENAI_API_URL: https://api.openai.com/v1
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: milu-telegram-allowlist
data:
  telegram_allowed_ids.json: |-
    []
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: milu
  labels:
    app.kubernetes.io/name: milu
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: milu
  template:
    metadata:
      labels:
        app.kubernetes.io/name: milu
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: milu
          image: biswajitind/agent-milu:latest
          imagePullPolicy: Always
          args:
            - --bot
          envFrom:
            - configMapRef:
                name: milu
            - secretRef:
                name: milu
          volumeMounts:
            - name: telegram-allowlist
              mountPath: /app/telegram_allowed_ids.json
              subPath: telegram_allowed_ids.json
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
      volumes:
        - name: telegram-allowlist
          configMap:
            name: milu-telegram-allowlist
